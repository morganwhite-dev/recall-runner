name: keep-awake

# Pings the live demo so Render's free tier never spins down (idle cutoff is 15 min), and pulls
# fresh recalls from CPSC once an hour. Needs repo variable SITE_URL (https://recall-runner.onrender.com,
# no trailing slash) and repo secret CRON_SECRET (same value as on Render).
on:
  schedule:
    - cron: "*/10 * * * *" # ping
    - cron: "7 * * * *" # recall sync
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/10 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health
        run: curl -fsS --retry 3 --retry-delay 10 --max-time 90 "${{ vars.SITE_URL }}/api/health"

  sync-recalls:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '7 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pull CPSC recalls
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --retry 2 --retry-delay 10 --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${{ vars.SITE_URL }}/api/cron/sync-recalls"
