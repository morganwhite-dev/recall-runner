name: ci

# Runs on every push and pull request. No secrets are used: the unit tests are pure.
# TODO(phase 1): add `npm run build` once the Home page build no longer needs a reachable database
# (prerendering "/" fails with ECONNREFUSED when DATABASE_URL is empty).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      # PageProps and LayoutProps are generated by Next.js; a fresh checkout has no .next/types yet.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test
