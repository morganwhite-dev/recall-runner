<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recall Runner - Several recalls - 3 Three-up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#FBF9F7; --surface:#FFFFFF; --surface-sunk:#F2EDEF;
  --ink:#1F1A21; --ink-muted:#5A525C; --line:#E0D9DD; --ctl:#8A808C;
  --brand:#3B1F3F; --on-brand:#FFFFFF;
  --accent:#FF9E7A; --on-accent:#2A1530;
  --recall:#9A4A12; --recall-bg:#FBE9DA;
  --rule-bg:#1F1A21; --rule-ink:#FFFFFF;
  --model-bg:#F1E7F2; --model-ink:#5B2A66;
  --ok-bg:#DDF1E5; --ok-ink:#14633A;
  --lav:#F1E7F2; --lav-2:#E6D3EA; --cream:#FFF8F0;
}
/* Contrast (computed): ink on lav 14.6, ink-muted on lav 6.2, ink-muted on white 7.6, ink-muted on surface-sunk 6.6,
   on-accent on coral 8.4, recall on recall-bg 5.3, ok-ink on ok-bg 6.4, model-ink on model-bg 8.3, ink on white 16.7.
   Coral is never used as text. */
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--cream);color:var(--ink);font:400 17px/1.6 'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
:focus-visible{outline:3px solid var(--brand);outline-offset:3px;border-radius:8px}
.wrap{max-width:1160px;margin:0 auto;padding:0 32px}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.art{fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button{font:inherit;color:inherit}

.tag{display:inline-flex;align-items:center;gap:5px;font:700 11px/1 'DM Sans',sans-serif;letter-spacing:.09em;text-transform:uppercase;padding:5px 9px;border-radius:999px;white-space:nowrap}
.tag .i{font-size:13px}
.tag.rule{background:var(--rule-bg);color:var(--rule-ink)}
.tag.model{background:var(--model-bg);color:var(--model-ink);border:1.5px dashed var(--model-ink);padding:3.5px 8px}
.badge{display:inline-block;font-weight:700;font-size:13px;letter-spacing:.04em;color:var(--recall);background:var(--recall-bg);padding:5px 12px;border-radius:999px}
.stat{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px;line-height:1.2;padding:5px 12px 5px 8px;border-radius:999px;background:var(--lav);color:var(--ink)}
.stat .i{font-size:18px}
.stat.ok{background:var(--ok-bg);color:var(--ok-ink)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;background:var(--accent);color:var(--on-accent);font:700 18px/1 'DM Sans',sans-serif;padding:0 20px;border:0;border-radius:999px;cursor:pointer;box-shadow:0 3px 0 var(--brand);transition:transform .15s,box-shadow .15s,background .15s}
.btn .i{font-size:22px}
.btn:hover{background:#FFB394}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--brand)}
.btn[disabled]{background:var(--surface-sunk);color:var(--ink-muted);box-shadow:inset 0 0 0 2px var(--ctl);cursor:not-allowed;transform:none}

.top{background:var(--lav);border-radius:0 0 56px 56px}
.top nav .wrap{display:flex;align-items:center;justify-content:space-between;height:76px;gap:16px}
.store{display:flex;align-items:center;gap:12px;font:800 21px/1.1 'Bricolage Grotesque',sans-serif;color:var(--brand)}
.store .mark{width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:20px}
.top nav p{font-size:15px;color:var(--ink-muted);display:flex;align-items:center;gap:8px;background:var(--surface);padding:6px 14px 6px 10px;border-radius:999px}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;padding:20px 32px 88px;align-items:center}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:15px;color:var(--brand);margin-bottom:16px}
.eyebrow .i{font-size:20px}
h1{font:800 clamp(40px,5.8vw,72px)/1.02 'Bricolage Grotesque',sans-serif;letter-spacing:-.035em;color:var(--ink);overflow-wrap:anywhere}
.hero .lede{font-size:21px;line-height:1.5;color:var(--ink-muted);margin-top:20px;max-width:28em}
.hero .lede b{color:var(--ink)}
.blob{position:relative;justify-self:center;width:min(100%,400px);aspect-ratio:1/.8;background:var(--lav-2);border-radius:58% 42% 52% 48% / 50% 58% 42% 50%;display:flex;align-items:center;justify-content:center;gap:2%;padding:0 9%;color:var(--brand)}
.blob:before,.blob:after{content:"";position:absolute;border-radius:50%;background:var(--accent)}
.blob:before{width:34px;height:34px;top:6%;right:12%}
.blob:after{width:16px;height:16px;bottom:10%;left:8%}
.blob svg.art{width:33%;height:auto;flex:none}

.pager{display:none;align-items:center;gap:12px 16px;flex-wrap:wrap;padding:28px 0 20px}
.pager .pos{font:700 20px 'Bricolage Grotesque',sans-serif}
.segs{display:flex;gap:6px;list-style:none;flex:1;min-width:100px;max-width:240px}
.segs li{flex:1;height:8px;border-radius:4px;background:var(--lav-2)}
.segs li.on{background:var(--brand)}
.pager .pg{display:flex;gap:8px;width:100%}
.pager button{flex:1;display:inline-flex;justify-content:center;align-items:center;gap:6px;min-height:48px;padding:0 20px;border-radius:999px;border:2px solid var(--brand);background:var(--surface);font-weight:600;cursor:pointer}
.pager button[disabled]{color:var(--ink-muted);border-color:var(--lav-2);background:var(--lav);cursor:not-allowed}

/* ---- layout 3: three equal columns on shared row lines (CSS subgrid) ---- */
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(6,auto);column-gap:24px;row-gap:0;margin-top:-40px;padding-bottom:16px}
.rc{grid-row:span 6;display:grid;grid-template-rows:subgrid;background:var(--surface);border-radius:24px;padding:28px;box-shadow:0 2px 0 var(--lav-2),0 28px 48px -36px rgba(59,31,63,.5)}
.rc>*{min-width:0}
.r1{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-bottom:16px}
.thumb{width:96px;height:96px;border-radius:50%;background:var(--lav-2);color:var(--brand);display:grid;place-items:center;flex:none}
.thumb svg.art{width:66%;height:66%}
.r2{padding-bottom:16px}
.r2 .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;font-size:14px;color:var(--ink-muted)}
.r2 h2{font:800 22px/1.2 'Bricolage Grotesque',sans-serif;letter-spacing:-.02em}
.r2 .sub{font-size:14px;line-height:1.4;color:var(--ink-muted);margin-top:6px}
.r3{padding-bottom:20px}
.r3 blockquote{font:500 15px/1.5 'DM Sans',sans-serif;border-left:6px solid var(--accent);padding-left:12px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.r3 .ai{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:13px;line-height:1.35;color:var(--ink-muted)}
.opts{border:0;display:grid;gap:8px;align-content:start;padding-bottom:12px}
.copt{position:relative;display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;min-height:48px;padding:6px 14px 6px 12px;border:2px solid var(--lav-2);border-radius:14px;background:var(--surface);cursor:pointer}
.copt input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.copt:focus-within{outline:3px solid var(--brand);outline-offset:3px}
.copt:has(input:checked){border-color:var(--brand);background:var(--lav)}
.copt input:disabled{cursor:default}
.rad{width:22px;height:22px;border-radius:50%;border:2px solid var(--ctl);background:var(--surface);display:grid;place-items:center}
.rad .i{font-size:22px;display:none;stroke:var(--on-brand);fill:var(--brand)}
.copt:has(input:checked) .rad{border-color:var(--brand)}
.copt:has(input:checked) .rad .i{display:block}
.copt b{font:700 15px/1.2 'Bricolage Grotesque',sans-serif}
.copt .a{font:800 17px/1 'Bricolage Grotesque',sans-serif}
.r5{padding-bottom:16px}
.ruleline{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.35;color:var(--ink-muted)}
.ruleline b{display:block;color:var(--ink);font-size:13px}
.buy{padding-top:16px;border-top:2px solid var(--lav);display:grid;gap:12px;align-content:end}
.buy .meta{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.buy .lab{font:700 14px/1 'DM Sans',sans-serif;color:var(--ink-muted)}
.buy .amt{font:800 32px/1 'Bricolage Grotesque',sans-serif;letter-spacing:-.03em}
.reassure{display:flex;gap:8px;align-items:center;justify-content:center;margin:20px auto 0;max-width:46em;text-align:center;font-size:15px;line-height:1.45;color:var(--ink-muted)}
.reassure .i{font-size:18px;color:var(--brand)}
.stack{padding-bottom:56px}

@supports not (grid-template-rows:subgrid){
  .rc{grid-template-rows:none;grid-auto-rows:min-content}.r1{min-height:112px}.r2{min-height:130px}.r3{min-height:150px}.opts{min-height:180px}.r5{min-height:50px}
}

footer .wrap{padding-top:8px;padding-bottom:40px;font-size:14px;color:var(--ink-muted)}

@media (max-width:1080px){.rc{padding:24px 20px}.three{column-gap:16px}.r2 h2{font-size:20px}}
@media (max-width:979px){
  body{font-size:16px}
  .wrap{padding:0 16px}
  .top{border-radius:0 0 36px 36px}
  .top nav .wrap{height:64px}.top nav p span{display:none}.top nav p{padding:8px}
  .hero{grid-template-columns:1fr;gap:20px;padding:4px 16px 64px}
  .blob{order:-1;width:min(78%,260px)}
  .hero .lede{font-size:18px}
  .pager{display:flex}
  .three{display:block;margin-top:0;padding-bottom:0}
  .rc{display:none;grid-template-rows:none;gap:0;padding:28px 20px}
  .rc.on{display:grid}
  .r3 blockquote{font-size:17px;-webkit-line-clamp:unset;display:block}
  .copt{min-height:56px}
  .reassure{margin:16px 0 0;justify-content:flex-start;text-align:left;align-items:flex-start}
  .stack{padding-bottom:150px}
  .buy{position:fixed;left:0;right:0;bottom:0;z-index:5;border-radius:24px 24px 0 0;background:var(--surface);box-shadow:0 -10px 28px -12px rgba(59,31,63,.35);padding:14px 16px calc(14px + env(safe-area-inset-bottom));border-top:0;display:flex;align-items:center;gap:14px}
  .buy .lab{display:none}
  .buy .amt{font-size:28px;letter-spacing:-.02em}
  .buy .act{flex:1}
  .buy .btn{min-height:52px;font-size:17px;padding:0 16px}
  footer .wrap{padding-bottom:150px}
}
@media (max-width:860px){.hero{padding:4px 16px 64px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="scale" viewBox="0 0 24 24"><path d="M12 3v18M7 21h10M5 7h14M5 7l-3 7a3.5 3.5 0 0 0 6 0L5 7zM19 7l-3 7a3.5 3.5 0 0 0 6 0l-3-7z"/></symbol>
  <symbol id="spark" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></symbol>
  <symbol id="check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></symbol>
  <symbol id="lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
  <symbol id="left" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
  <symbol id="right" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></symbol>
  <symbol id="store" viewBox="0 0 24 24"><path d="M4 9l1.5-5h13L20 9M4 9v11h16V9M4 9a2.7 2.7 0 0 0 5.3 0 2.7 2.7 0 0 0 5.4 0A2.7 2.7 0 0 0 20 9M10 20v-5h4v5"/></symbol>
  <symbol id="art-warmer" viewBox="0 0 96 96"><rect x="22" y="40" width="52" height="40" rx="12"/><rect x="30" y="48" width="36" height="24" rx="7" stroke-width="1.5" stroke-dasharray="3 4"/><path d="M36 30c-3-4 3-6 0-11M48 30c-3-4 3-6 0-11M60 30c-3-4 3-6 0-11"/></symbol>
  <symbol id="art-battery" viewBox="0 0 96 96"><rect x="14" y="34" width="58" height="36" rx="9"/><path d="M72 45h6a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-6"/><path d="M46 42l-7 10h9l-7 10" stroke-width="2"/><path d="M30 70v8q0 6 8 6h14" stroke-width="1.5"/></symbol>
  <symbol id="art-dresser" viewBox="0 0 96 96"><rect x="20" y="14" width="56" height="64" rx="4"/><path d="M20 32h56M20 47h56M20 62h56M48 14v64" stroke-width="1.5"/><path d="M30 23h8M58 23h8M30 40h8M58 40h8M30 55h8M58 55h8M30 70h8M58 70h8"/><path d="M26 78v8M70 78v8"/></symbol>
</svg>

<div id="app"></div>
<p class="sr" id="live" aria-live="polite"></p>
<footer><div class="wrap">Demo store. The merchant and order dates are made up; the recalls are real CPSC data. Not affiliated with CPSC or PayPal.</div></footer>

<script>
const q=new URLSearchParams(location.search);
const S={i:Math.min(2,Math.max(0,(parseInt(q.get('recall'),10)||1)-1)),pick:[null,null,null],done:[false,false,false]};
if(['refund','replace','repair'].includes(q.get('picked')))S.pick=[q.get('picked'),q.get('picked'),q.get('picked')];
const ic=(n,c)=>`<svg class="i${c?' '+c:''}" aria-hidden="true"><use href="#${n}"/></svg>`;
const art=r=>`<svg class="art" viewBox="0 0 96 96" role="img" aria-label="${r.alt}"><use href="#${r.art}"/></svg>`;
const artD=r=>`<svg class="art" viewBox="0 0 96 96" aria-hidden="true"><use href="#${r.art}"/></svg>`;
const R=[
 {art:'art-warmer',alt:'Line drawing of a rechargeable hand warmer',cpsc:'CPSC #27011',date:'Oct 1, 2026',name:'HotHands Rechargeable Hand Warmers',days:45,price:'$34.00',hazard:'The lithium-ion battery and electrical components in the recalled hand warmers can overheat and ignite, posing a risk of serious injury from fire and burn hazards.'},
 {art:'art-battery',alt:'Line drawing of a recliner battery pack',cpsc:'CPSC #26301',date:'Sep 11, 2026',name:'Recliner battery pack',days:60,price:'$59.00',hazard:'The recalled battery packs can overheat, posing a fire hazard.'},
 {art:'art-dresser',alt:'Line drawing of an 8-drawer dresser',cpsc:'CPSC #26794',date:'Aug 7, 2026',name:'Aitjunz 8-Drawer Dresser',days:70,price:'$249.00',hazard:'The recalled dressers are unstable if they are not anchored to the wall, posing tip-over and entrapment hazards to children.'}
];
const REM={
 refund:{name:'Full refund',short:'Full refund',d:'Paid back to your PayPal account.'},
 replace:{name:'Free replacement pack',short:'Replacement pack',d:'No money. Tracking is added to your order.'},
 repair:{name:'Free repair kit',short:'Repair kit',d:'No money. The kit is mailed to you.'}
};
const amt=(r,k)=>k==='refund'?r.price:'Free';
const T={rule:`<span class="tag rule">${ic('scale')}Rule</span>`,model:`<span class="tag model">${ic('spark')}Model</span>`};
const status=k=>S.done[k]?`<span class="stat ok">${ic('check')}Settled</span>`:`<span class="stat">${ic('info')}Needs your choice</span>`;
const pager=()=>`<nav class="pager" aria-label="Your recalls"><p class="pos">Recall ${S.i+1} of 3</p><ol class="segs" aria-hidden="true">${R.map((_,k)=>`<li class="${k<=S.i?'on':''}"></li>`).join('')}</ol><div class="pg"><button data-act="prev"${S.i===0?' disabled':''}>${ic('left')}Back</button><button data-act="next"${S.i===2?' disabled':''}>Next${ic('right')}</button></div></nav>`;

function card(r,k){const dn=S.done[k];
  const opts=['refund','replace','repair'].map(m=>`<label class="copt"><input type="radio" name="rem${k}" data-i="${k}" value="${m}"${S.pick[k]===m?' checked':''}${dn?' disabled':''}><span class="rad">${ic('check')}</span><span><b>${REM[m].short}</b><span class="sr">. ${REM[m].d}</span></span><span class="a">${amt(r,m)}</span></label>`).join('');
  return `<article class="rc${k===S.i?' on':''}" aria-labelledby="n${k}">
   <div class="r1"><span class="thumb">${art(r)}</span>${status(k)}</div>
   <div class="r2"><p class="meta"><span class="badge">${r.cpsc}</span><span>Recalled ${r.date}</span></p><h2 id="n${k}">${r.name}</h2><p class="sub">Bought ${r.days} days ago &middot; ${r.price}</p></div>
   <div class="r3"><blockquote title="${r.hazard}">&ldquo;${r.hazard}&rdquo;</blockquote><p class="ai">${T.model}<span>Notice drafted by AI from the CPSC record</span></p></div>
   <fieldset class="opts"><legend class="sr">Choose a remedy for ${r.name}</legend>${opts}</fieldset>
   <div class="r5"><p class="ruleline">${T.rule}<span><b>Chosen by fixed rules, not AI</b>These options are offered by the recall</span></p></div>
   <div class="buy"><div class="meta"><span class="lab">Your remedy</span><span class="amt" id="amt${k}"></span></div>
    <div class="act"><button class="btn" id="cta${k}" data-i="${k}"></button></div></div>
  </article>`}

function view(){
  return `<div class="top"><nav aria-label="Store"><div class="wrap"><div class="store"><span class="mark">${ic('store')}</span>Brightnest Home</div><p>${ic('info')}<span>Safety recall notice</span></p></div></nav>
  <header class="wrap hero"><div><p class="eyebrow">${ic('info')}Safety recall notices</p>
   <h1>You have 3 recalls</h1>
   <p class="lede"><b>Please stop using these items.</b> Each recall is settled on its own. Pick how you want to settle each one, then confirm with PayPal.</p></div>
   <div class="blob" aria-hidden="true">${R.map(artD).join('')}</div></header></div>
  <div class="wrap">${pager()}
   <div class="stack"><div class="three">${R.map(card).join('')}</div>
   <p class="reassure">${ic('lock')}<span>You sign in with PayPal so only you can claim this. We never see your password.</span></p></div>
  </div>`}
function sync(){R.forEach((r,k)=>{const m=S.pick[k],dn=S.done[k],b=document.getElementById('cta'+k);
  b.disabled=dn||!m;b.innerHTML=dn?ic('check')+'Settled':m?'Confirm with PayPal':'Choose a remedy';
  document.getElementById('amt'+k).textContent=m?amt(r,m):'Choose one'})}
function render(f){document.getElementById('app').innerHTML=view();sync();if(f){const e=document.querySelector(f);if(e&&!e.disabled)e.focus({preventScroll:true})}}
const phone=()=>matchMedia('(max-width:979px)').matches;
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(b&&!b.disabled){const a=b.dataset.act;
    S.i=a==='prev'?Math.max(0,S.i-1):Math.min(2,S.i+1);
    render(`[data-act="${a}"]`);window.scrollTo(0,0);return}
  const c=e.target.closest('.btn');
  if(c&&!c.disabled){const k=+c.dataset.i;S.done[k]=true;
    document.getElementById('live').textContent='Settled: '+R[k].name;
    if(phone()){const nx=[1,2].map(d=>(k+d)%3).find(j=>!S.done[j]);if(nx!==undefined)S.i=nx}
    render(phone()?null:'#cta'+k);if(phone())window.scrollTo(0,0)}
});
document.addEventListener('change',e=>{if(e.target.type==='radio'){S.pick[+e.target.dataset.i]=e.target.value;sync()}});
render();
</script>
</body>
</html>
