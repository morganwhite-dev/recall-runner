<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recall Runner - Buyer page (Plum, 2 Stepper card)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#FBF9F7; --surface:#FFFFFF; --surface-sunk:#F2EDEF;
  --ink:#1F1A21; --ink-muted:#5A525C; --line:#E0D9DD; --ctl:#8A808C;
  --brand:#3B1F3F; --on-brand:#FFFFFF;
  --accent:#FF9E7A; --on-accent:#2A1530;
  --on-ground:#FFFFFF; --on-ground-muted:#DCCBDD;
  --recall:#9A4A12; --recall-bg:#FBE9DA;
  --rule-bg:#1F1A21; --rule-ink:#FFFFFF;
  --model-bg:#F1E7F2; --model-ink:#5B2A66;
  --ok-bg:#DDF1E5; --ok-ink:#14633A;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ground);color:var(--ink);font:400 16px/1.55 'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
:focus-visible{outline:3px solid var(--brand);outline-offset:3px;border-radius:4px}
.wrap{max-width:1200px;margin:0 auto;padding:0 32px}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.art{fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button{font:inherit;color:inherit}

/* demo toolbar (not part of the product) */
.demo{background:var(--surface-sunk);border-bottom:2px dashed var(--ctl);padding:10px 0;font:500 12px/1.3 'DM Mono',monospace}
.demo .wrap{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center}
.demo .grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.demo .grp span{color:var(--ink-muted)}
.demo button{min-height:44px;padding:0 12px;border:1.5px solid var(--ctl);background:#fff;border-radius:6px;font:500 12px 'DM Mono',monospace;cursor:pointer}
.demo button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

.tag{display:inline-flex;align-items:center;gap:5px;font:700 11px/1 'DM Sans',sans-serif;letter-spacing:.09em;text-transform:uppercase;padding:5px 9px;border-radius:999px;white-space:nowrap}
.tag .i{font-size:13px}
.tag.rule{background:var(--rule-bg);color:var(--rule-ink)}
.tag.model{background:var(--model-bg);color:var(--model-ink);border:1.5px dashed var(--model-ink);padding:3.5px 8px}
.status{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px;color:var(--ok-ink);background:var(--ok-bg);padding:5px 12px 5px 9px;border-radius:999px}
.status .i{font-size:17px}
.status.warn{background:var(--surface-sunk);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ctl)}
.badge{display:inline-block;font-weight:700;font-size:12px;letter-spacing:.04em;color:var(--recall);background:var(--recall-bg);padding:4px 10px;border-radius:999px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;background:var(--accent);color:var(--on-accent);font:700 17px/1 'DM Sans',sans-serif;padding:0 28px;border:0;border-radius:999px;cursor:pointer;transition:transform .15s,background .15s}
.btn:hover{background:#FFB394}.btn:active{transform:scale(.98)}
.btn[disabled]{background:var(--surface-sunk);color:var(--ink-muted);cursor:not-allowed;transform:none}
.link{display:inline-flex;align-items:center;gap:6px;min-height:44px;font-weight:600;color:var(--brand);text-underline-offset:4px;background:none;border:0;cursor:pointer;text-decoration:underline}

/* centered column */
.col{max-width:640px;margin:0 auto;padding:0 20px}
.hd{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:28px 0 20px}
.store{display:flex;align-items:center;gap:12px;font:800 22px/1.1 'Bricolage Grotesque',sans-serif;letter-spacing:-.01em}
.store .mark{width:40px;height:40px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-size:21px}
.hd p{font-size:14px;color:var(--ink-muted)}

.steps{display:flex;list-style:none;margin:8px 0 24px}
.steps li{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-size:13px;line-height:1.3;font-weight:600;color:var(--ink-muted);padding:0 4px}
.steps li:not(:first-child):before{content:"";position:absolute;top:15px;right:50%;width:100%;height:2px;background:var(--line);z-index:0}
.steps li.done:not(:first-child):before,.steps li.cur:not(:first-child):before,.steps li.warn:not(:first-child):before{background:var(--brand)}
.node{position:relative;z-index:1;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--ground);box-shadow:inset 0 0 0 2px var(--ctl);color:var(--ink-muted);font:700 14px/1 'DM Sans',sans-serif}
.node .i{font-size:20px}
.steps li.done .node{background:var(--brand);color:var(--on-brand);box-shadow:none}
.steps li.cur .node{background:var(--brand);color:var(--on-brand);box-shadow:0 0 0 4px var(--ground),0 0 0 6px var(--accent)}
.steps li.warn .node{background:var(--surface-sunk);color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.steps li.cur,.steps li.done,.steps li.warn{color:var(--ink)}
.steps small{display:block;font-weight:500;font-size:12px;color:var(--ink-muted)}

/* surface 1: the card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:32px;box-shadow:0 24px 48px -32px rgba(59,31,63,.45)}
.card h1,.card h2.h{font:800 28px/1.1 'Bricolage Grotesque',sans-serif;letter-spacing:-.025em;overflow-wrap:anywhere}
.eyebrow{font:700 12px/1 'DM Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:10px;display:block}
.prod{display:flex;gap:16px;align-items:center;margin-bottom:18px}
.prod .art{width:84px;height:84px;color:var(--brand)}
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--ink-muted);margin-bottom:8px}
.order{margin-top:10px;color:var(--ink-muted);font-size:15px}.order b{color:var(--ink)}
blockquote{margin-top:20px;border-left:4px solid var(--brand);padding:2px 0 2px 18px;font:500 19px/1.5 'DM Sans',sans-serif}
.qcap{font-size:14px;color:var(--ink-muted);margin:8px 0 0 22px}
.aiNote{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px;font-size:14px;color:var(--ink-muted)}
.stop{display:flex;gap:14px;align-items:center;margin-top:20px;padding:16px 0 0;border-top:1px solid var(--line)}
.stop .i{font-size:26px;color:var(--brand)}
.stop b{display:block;font:700 18px/1.3 'Bricolage Grotesque',sans-serif}
.stop span{font-size:15px;color:var(--ink-muted)}
.lede{font-size:17px;color:var(--ink-muted);margin-top:12px}
.back{margin:-12px 0 8px -8px;padding:0 8px;text-decoration:none}

.fact{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:16px 0;margin-top:18px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.ico{width:48px;height:48px;border-radius:50%;background:var(--surface-sunk);color:var(--brand);display:grid;place-items:center;font-size:24px}
.fact b{font:700 18px/1.25 'Bricolage Grotesque',sans-serif;display:block}
.d{font-size:14px;line-height:1.4;color:var(--ink-muted);display:block;margin-top:2px}
.amt{font:800 28px/1 'Bricolage Grotesque',sans-serif;letter-spacing:-.02em}
.ruleline{display:flex;gap:12px;align-items:flex-start;margin-top:14px;font-size:14px;color:var(--ink-muted)}
.ruleline b{display:block;color:var(--ink)}
.opts{border:0;margin-top:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;min-height:180px;padding:16px 8px 12px;border:1.5px solid var(--ctl);border-radius:12px;background:var(--surface);cursor:pointer}
.opt input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.opt:focus-within{outline:3px solid var(--brand);outline-offset:3px}
.opt:has(input:checked){border-color:var(--brand);box-shadow:inset 0 0 0 1.5px var(--brand);background:var(--surface-sunk)}
.opt .chk{position:absolute;top:8px;right:8px;display:none;color:var(--brand);font-size:20px}
.opt:has(input:checked) .chk{display:block}
.opt b{font:700 15px/1.2 'Bricolage Grotesque',sans-serif}
.opt .amt{font-size:22px}
.opt .d{font-size:13px}
.reassure{display:flex;gap:8px;align-items:flex-start;margin-top:16px;font-size:14px;line-height:1.45;color:var(--ink-muted)}
.reassure .i{font-size:17px;margin-top:1px;color:var(--brand)}
.rcpt div{display:flex;justify-content:space-between;gap:16px;align-items:center;min-height:48px;padding:8px 0;border-top:1px solid var(--line)}
.rcpt{margin-top:18px}
.rcpt div:first-child{border-top:0}
.rcpt dt{color:var(--ink-muted);font-size:14px}
.rcpt dd{font-weight:600;text-align:right;overflow-wrap:anywhere}
.rcpt .mono{font:500 13px 'DM Mono',monospace}
.list{margin-top:18px}
.list li{list-style:none;display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line)}
.list .i{font-size:22px;color:var(--brand);margin-top:2px}

/* recall pager */
.pager{display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap;padding-bottom:16px;margin-bottom:8px}
.pager .pos{font:700 18px 'Bricolage Grotesque',sans-serif}
.segs{display:flex;gap:6px;list-style:none;flex:1;min-width:100px;max-width:200px}
.segs li{flex:1;height:6px;border-radius:3px;background:var(--line)}
.segs li.on{background:var(--brand)}
.pager .pg{display:flex;gap:8px;margin-left:auto}
.pager button{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--ctl);background:var(--surface);font-weight:600;cursor:pointer}
.pager button[disabled]{color:var(--ink-muted);border-color:var(--line);background:var(--surface-sunk);cursor:not-allowed}

/* sticky footer bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -12px 24px -18px rgba(59,31,63,.4);padding:12px 0 calc(12px + env(safe-area-inset-bottom))}
.bar .col{display:flex;align-items:center;justify-content:space-between;gap:16px}
.bar .sum{min-width:0;font-size:14px;color:var(--ink-muted);line-height:1.3}
.bar .sum b{display:block;color:var(--ink);font:700 17px 'Bricolage Grotesque',sans-serif}
.bar .btn{width:auto;min-width:240px}
.bar .alt{display:flex;flex-direction:column;align-items:flex-end}

footer .col{padding-top:28px;padding-bottom:140px;font-size:14px;color:var(--ink-muted)}
footer .col p{border-top:1px solid var(--line);padding-top:20px}

@media (max-width:860px){
  .hd{padding:20px 0 14px}
  .store{font-size:19px}.store .mark{width:34px;height:34px}
  .card{padding:24px 20px;box-shadow:none}
  .card h1,.card h2.h{font-size:25px}
  blockquote{font-size:18px}
  .bar .col{flex-direction:column;align-items:stretch;gap:8px}
  .bar .sum{display:none}
  .bar .btn{width:100%;min-width:0}
  .bar .alt{align-items:stretch}
  .opts{gap:8px}.opt{padding:14px 6px 10px}
  .fact{grid-template-columns:auto 1fr}.fact .amt{grid-column:2}
  .pager .pg{margin-left:0;width:100%}.pager .pg button{flex:1;justify-content:center}
  .steps li{font-size:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="scale" viewBox="0 0 24 24"><path d="M12 3v18M7 21h10M5 7h14M5 7l-3 7a3.5 3.5 0 0 0 6 0L5 7zM19 7l-3 7a3.5 3.5 0 0 0 6 0l-3-7z"/></symbol>
  <symbol id="spark" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></symbol>
  <symbol id="check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></symbol>
  <symbol id="tick" viewBox="0 0 24 24"><path d="M6 12.5l4 4 8-9"/></symbol>
  <symbol id="lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="refund" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/></symbol>
  <symbol id="box" viewBox="0 0 24 24"><path d="M3 8l9-5 9 5v8l-9 5-9-5zM3 8l9 5 9-5M12 13v8"/></symbol>
  <symbol id="wrench" viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0 5 5L21 13l-8 8-3-3 8-8-1.3-1.3a4 4 0 0 1-5-5L13 2l-2 2M3 21l6-6"/></symbol>
  <symbol id="info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
  <symbol id="pause" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 9v6M14 9v6"/></symbol>
  <symbol id="left" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
  <symbol id="right" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></symbol>
  <symbol id="help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17h.01"/></symbol>
  <symbol id="store" viewBox="0 0 24 24"><path d="M4 9l1.5-5h13L20 9M4 9v11h16V9M4 9a2.7 2.7 0 0 0 5.3 0 2.7 2.7 0 0 0 5.4 0A2.7 2.7 0 0 0 20 9M10 20v-5h4v5"/></symbol>
  <symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="art-warmer" viewBox="0 0 96 96"><rect x="22" y="40" width="52" height="40" rx="12"/><rect x="30" y="48" width="36" height="24" rx="7" stroke-width="1.5" stroke-dasharray="3 4"/><path d="M36 30c-3-4 3-6 0-11M48 30c-3-4 3-6 0-11M60 30c-3-4 3-6 0-11"/></symbol>
  <symbol id="art-battery" viewBox="0 0 96 96"><rect x="14" y="34" width="58" height="36" rx="9"/><path d="M72 45h6a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-6"/><path d="M46 42l-7 10h9l-7 10" stroke-width="2"/><path d="M30 70v8q0 6 8 6h14" stroke-width="1.5"/></symbol>
  <symbol id="art-dresser" viewBox="0 0 96 96"><rect x="20" y="14" width="56" height="64" rx="4"/><path d="M20 32h56M20 47h56M20 62h56M48 14v64" stroke-width="1.5"/><path d="M30 23h8M58 23h8M30 40h8M58 40h8M30 55h8M58 55h8M30 70h8M58 70h8"/><path d="M26 78v8M70 78v8"/></symbol>
</svg>

<div class="demo" role="region" aria-label="Design preview controls"><div class="wrap">
  <span>Design preview: state</span>
  <div class="grp">
    <button data-act="view" data-v="notice">Notice</button>
    <button data-act="view" data-v="several">Several recalls</button>
    <button data-act="view" data-v="success">Refund sent</button>
    <button data-act="view" data-v="mismatch">Account mismatch</button>
  </div>
  <div class="grp"><span>Notice step:</span>
    <button data-act="step" data-v="1">1</button><button data-act="step" data-v="2">2</button><button data-act="step" data-v="3">3</button>
  </div>
  <div class="grp"><span>Remedy options:</span>
    <button data-act="multi" data-v="0">One</button>
    <button data-act="multi" data-v="1">Three</button>
  </div>
</div></div>

<header class="col hd">
  <div class="store"><span class="mark"><svg class="i" aria-hidden="true"><use href="#store"/></svg></span>Brightnest Home</div>
  <p>Safety recall notice</p>
</header>
<main class="col" id="app" aria-live="polite"></main>
<div id="barhost"></div>
<footer><div class="col"><p>Demo store. The merchant and order dates are made up; the recalls are real CPSC data. Not affiliated with CPSC or PayPal.</p></div></footer>

<script>
/* ---- shared data and helpers ---- */
const S={view:'notice',i:0,multi:false,picked:null,step:1};
const ic=(n,c)=>`<svg class="i${c?' '+c:''}" aria-hidden="true"><use href="#${n}"/></svg>`;
const art=r=>`<svg class="art" viewBox="0 0 96 96" role="img" aria-label="${r.alt}"><use href="#${r.art}"/></svg>`;
const R=[
 {art:'art-warmer',alt:'Line drawing of a rechargeable hand warmer',cpsc:'CPSC #27011',date:'Oct 1, 2026',name:'HotHands Rechargeable Hand Warmers',item:'HotHands Rechargeable Hand Warmers, 2-pack',days:45,price:'$34.00',them:'them',rem:'refund',hazard:'The lithium-ion battery and electrical components in the recalled hand warmers can overheat and ignite, posing a risk of serious injury from fire and burn hazards.'},
 {art:'art-battery',alt:'Line drawing of a recliner battery pack',cpsc:'CPSC #26301',date:'Sep 11, 2026',name:'Recliner battery pack',item:'Recliner battery pack',days:60,price:'$59.00',them:'it',rem:'replace',hazard:'The recalled battery packs can overheat, posing a fire hazard.'},
 {art:'art-dresser',alt:'Line drawing of an 8-drawer dresser',cpsc:'CPSC #26794',date:'Aug 7, 2026',name:'Aitjunz 8-Drawer Dresser',item:'Aitjunz 8-Drawer Dresser',days:70,price:'$249.00',them:'it',rem:'repair',hazard:'The recalled dressers are unstable if they are not anchored to the wall, posing tip-over and entrapment hazards to children.'}
];
const REM={
 refund:{ic:'refund',name:'Full refund',short:'Full refund',amt:'$34.00',d:'Paid back to your PayPal account.',rule:'Refund: paid within 180 days'},
 replace:{ic:'box',name:'Free replacement battery pack',short:'Replacement pack',amt:'Free',d:'No money. Tracking is added to your order.',rule:'Replacement: the recall offers a new pack'},
 repair:{ic:'wrench',name:'Free repair kit',short:'Repair kit',amt:'Free',d:'No money. The kit is mailed to you.',rule:'Repair: the recall offers a repair kit'}
};
const T={rule:`<span class="tag rule">${ic('scale')}Rule</span>`,model:`<span class="tag model">${ic('spark')}Model</span>`};
const orderLine=r=>`<b>${r.item}</b> · bought from Brightnest Home ${r.days} days ago · ${r.price}`;
const ruleLine=r=>S.multi
  ?`<p class="ruleline">${T.rule}<span><b>Chosen by fixed rules, not AI</b>These options are offered by the recall</span></p>`
  :`<p class="ruleline">${T.rule}<span><b>Chosen by fixed rules, not AI</b>${REM[r.rem].rule}</span></p>`;
function remedy(r){
  if(!S.multi){const m=REM[r.rem];
    return `<div class="fact"><span class="ico">${ic(m.ic)}</span><div><b>${m.name}</b><span class="d">${m.d}</span></div><span class="amt">${m.amt}</span></div>`;}
  return `<fieldset class="opts"><legend class="sr">Choose a remedy</legend>`+['refund','replace','repair'].map(k=>{const m=REM[k];
    return `<label class="opt"><input type="radio" name="rem" value="${k}"${S.picked===k?' checked':''}><span class="chk">${ic('check')}</span><span class="ico">${ic(m.ic)}</span><b>${m.short}</b><span class="amt">${m.amt}</span><span class="d">${m.d}</span></label>`}).join('')+`</fieldset>`;
}
const REASSURE=`<p class="reassure">${ic('lock')}<span>You sign in with PayPal so only you can claim this. We never see your password.</span></p>`;
const pager=()=>`<nav class="pager" aria-label="Your recalls"><p class="pos">Recall ${S.i+1} of 3</p><ol class="segs" aria-hidden="true">${R.map((_,k)=>`<li class="${k<=S.i?'on':''}"></li>`).join('')}</ol><div class="pg"><button data-act="prev"${S.i===0?' disabled':''}>${ic('left')}Back</button><button data-act="next"${S.i===2?' disabled':''}>Next${ic('right')}</button></div></nav>`;
const picked=()=>S.multi?REM[S.picked]:REM[R[S.i].rem];

/* ---- layout 2: stepper card ---- */
const LABELS=['Review notice','Choose remedy','Sign in with PayPal'];
function steps(states){return `<ol class="steps" aria-label="Progress">`+LABELS.map((l,k)=>{const s=states[k];
  const inner=s==='done'?ic('tick'):s==='warn'?ic('info'):k+1;
  const word=s==='done'?'Done':s==='cur'?'Current step':s==='warn'?'Needs attention':'';
  return `<li class="${s}"${s==='cur'||s==='warn'?' aria-current="step"':''}><span class="node">${inner}</span><span>${l}${word?`<small>${word}</small>`:''}</span></li>`}).join('')+`</ol>`}
function barHTML(inner){return `<div class="bar"><div class="col">${inner}</div></div>`}
function stepCard(){const r=R[S.i];
  if(S.step===1)return `<section class="card" aria-labelledby="h">
    <span class="eyebrow">Step 1 of 3 · Review notice</span>
    <div class="prod">${art(r)}<div><p class="meta"><span class="badge">${r.cpsc}</span><span>Recalled ${r.date}</span></p><h1 id="h">${r.name}</h1></div></div>
    <p class="order">${orderLine(r)}</p>
    <blockquote>&ldquo;${r.hazard}&rdquo;</blockquote>
    <p class="qcap">From the CPSC recall notice, ${r.cpsc}</p>
    <p class="aiNote">${T.model}<span>Notice drafted by AI from the CPSC record</span></p>
    <div class="stop">${ic('pause')}<div><b>Please stop using ${r.them}</b><span>The next two steps take about a minute.</span></div></div>
  </section>`;
  if(S.step===2)return `<section class="card" aria-labelledby="h">
    <button class="link back" data-act="step" data-v="1">${ic('left')}Back</button>
    <span class="eyebrow">Step 2 of 3 · Choose remedy</span>
    <h2 class="h" id="h">${S.multi?'Choose how to settle this':'Here is your remedy'}</h2>
    <p class="order">${orderLine(r)}</p>
    ${remedy(r)}${ruleLine(r)}
  </section>`;
  const m=picked()||REM[r.rem];
  return `<section class="card" aria-labelledby="h">
    <button class="link back" data-act="step" data-v="2">${ic('left')}Back</button>
    <span class="eyebrow">Step 3 of 3 · Sign in with PayPal</span>
    <h2 class="h" id="h">Sign in to confirm</h2>
    <dl class="rcpt"><div><dt>Item</dt><dd>${r.item}</dd></div><div><dt>Remedy</dt><dd>${m.name}</dd></div><div><dt>Amount</dt><dd>${m.amt}</dd></div></dl>
    ${REASSURE}
  </section>`}
function notice(){
  const r=R[S.i],st=S.step===1?['cur','todo','todo']:S.step===2?['done','cur','todo']:['done','done','cur'];
  const m=picked()||REM[r.rem];
  const label=S.step===3?'Confirm with PayPal':'Continue';
  const sum=S.step===1?`<span class="sum"><b>${r.name}</b>${r.cpsc}</span>`:`<span class="sum"><b>${S.multi&&!S.picked?'Choose a remedy':m.name}</b>${S.multi&&!S.picked?'Pick one above':m.amt==='Free'?'No money':m.amt}</span>`;
  return (S.view==='several'?pager():'')+steps(st)+stepCard()+barHTML(sum+`<button class="btn" id="cta" data-label="${label}" data-gate="${S.step===2?1:0}">${S.step===2&&S.multi&&!S.picked?'Choose a remedy':label}</button>`)}
function success(){const r=R[0];return steps(['done','done','done'])+`<section class="card" aria-labelledby="h">
  <span class="status">${ic('check')}Refund sent</span>
  <h1 id="h" style="margin-top:14px">Your refund of $34.00 is on its way</h1>
  <p class="lede">You don't need to do anything else.</p>
  <ul class="list"><li>${ic('clock')}<span><b>What happens next:</b> PayPal refunds usually show in 3 to 5 business days.</span></li></ul>
  <dl class="rcpt" aria-label="Receipt"><div><dt>Order</dt><dd>BH-48213</dd></div><div><dt>Amount</dt><dd>$34.00</dd></div><div><dt>Reference</dt><dd class="mono">8EG04191BL774610V</dd></div></dl>
  <p class="ruleline" style="padding-top:14px;border-top:1px solid var(--line)">${T.rule}<span><b>Chosen by fixed rules, not AI</b>${REM.refund.rule}</span></p>
  <p style="margin-top:16px"><a class="link" href="#" data-act="view" data-v="several" style="font-weight:600">Back to your recalls</a></p>
</section>`}
function mismatch(){return steps(['done','done','warn'])+`<section class="card" aria-labelledby="h">
  <span class="status warn">${ic('info')}Account doesn't match</span>
  <h1 id="h" style="margin-top:14px">This PayPal account doesn't match the one used for this order</h1>
  <p class="lede">Nothing was charged and nothing was sent. Your recall is still waiting for you.</p>
  <ul class="list"><li>${ic('lock')}<span>We check this so only the person who bought the item can claim.</span></li></ul>
  <p><a class="link" href="#" style="font-weight:600">${ic('help')}Need help?</a></p>
</section>`+barHTML(`<span class="sum"><b>Not matched</b>Sign in with the account used for the order</span><button class="btn" id="cta" data-label="Try a different PayPal account" data-gate="0">Try a different PayPal account</button>`)}
function sync(){const b=document.getElementById('cta');if(!b)return;const lock=b.dataset.gate==='1'&&S.multi&&!S.picked;b.disabled=lock;b.textContent=lock?'Choose a remedy':b.dataset.label;
  const s=document.querySelector('.bar .sum');if(s&&S.view!=='mismatch'&&S.step===2){const m=picked();s.innerHTML=m?`<b>${m.name}</b>${m.amt==='Free'?'No money':m.amt}`:'<b>Choose a remedy</b>Pick one above'}}
function render(){
  const v=S.view;
  document.getElementById('app').innerHTML=v==='success'?success():v==='mismatch'?mismatch():notice();
  document.querySelectorAll('.demo [data-act=view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===v)));
  document.querySelectorAll('.demo [data-act=multi]').forEach(b=>b.setAttribute('aria-pressed',String((b.dataset.v==='1')===S.multi)));
  document.querySelectorAll('.demo [data-act=step]').forEach(b=>b.setAttribute('aria-pressed',String((v==='notice'||v==='several')&&+b.dataset.v===S.step)));
  sync();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(b&&!b.disabled){const a=b.dataset.act;
    if(a==='view'){e.preventDefault();S.view=b.dataset.v;S.picked=null;S.i=0;S.step=S.view==='several'?2:1}
    else if(a==='step'){if(S.view!=='notice'&&S.view!=='several')S.view='notice';S.step=+b.dataset.v}
    else if(a==='multi'){S.multi=b.dataset.v==='1';S.picked=null}
    else if(a==='prev'){S.i=Math.max(0,S.i-1);S.picked=null}
    else if(a==='next'){S.i=Math.min(2,S.i+1);S.picked=null}
    render();window.scrollTo(0,0);return}
  const c=e.target.closest('#cta');
  if(c&&!c.disabled){
    if(S.view==='mismatch'){S.view='notice';S.step=3}
    else if(S.step<3)S.step++;
    else{S.view='success'}
    render();window.scrollTo(0,0)}
});
document.addEventListener('change',e=>{if(e.target.name==='rem'){S.picked=e.target.value;sync()}});
render();
</script>
</body>
</html>
